name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    # Keep this ref in sync with the zmk revision in config/west.yml
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  release:
    name: Publish release
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l firmware
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest firmware/totem_left.uf2 firmware/totem_right.uf2 \
            --target "$GITHUB_SHA" \
            --latest \
            --title "TOTEM firmware" \
            --notes "Built from ${GITHUB_SHA::7} with ZMK v0.3.

          - \`totem_left.uf2\`: left half (central, ZMK Studio enabled)
          - \`totem_right.uf2\`: right half

          Flash: double-tap reset on the XIAO and copy the matching file to the USB drive."
