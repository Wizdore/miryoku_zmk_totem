# Enable mouse support
CONFIG_ZMK_POINTING=y

# Deep sleep after 4 hours without a key press
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=14400000

# ZMK Studio is enabled for the left (central) half in build.yaml

# Branding: max 16 characters, also used as the USB product name
CONFIG_ZMK_KEYBOARD_NAME="Shaon's ToTeM"
# Always use the name above. Otherwise the name saved on first boot is kept,
# and renaming requires clearing settings (pairings and ZMK Studio changes).
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
# CONFIG_USB_DEVICE_MANUFACTURER="mail@shaon.eu"
